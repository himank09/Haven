name: Build Windows app

# Push a tag like v0.2.0 to build Haven.exe and attach it to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build
        run: >
          pyinstaller --noconfirm --clean --windowed --name Haven
          --icon assets/icon.ico
          --add-data "haven/web;haven/web" --add-data "assets;assets"
          --collect-all pypdfium2 --collect-all pillow_heif --collect-all webview --collect-all imageio_ffmpeg
          --collect-submodules uvicorn --hidden-import clr
          app.py
      - name: Zip
        run: Compress-Archive -Path dist/Haven -DestinationPath Haven-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Haven-windows
          path: Haven-windows.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Haven-windows.zip
