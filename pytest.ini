[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient`
markers =
    ui: Playwright UI tests (need Chromium)
    slow: slower tests (large PDFs, performance)
    live: real provider keys (tests/live_smoke.py)
